    *{box-sizing:border-box}

    #title{margin:0;padding:10px 18px;border-radius:17px;background:#fffbea;color:#e65139;box-shadow:0 6px 0 #e7b769,0 10px 25px #286e8850;font-size:clamp(15px,2.1vw,25px);font-weight:900;letter-spacing:.035em}
    .stats{display:flex;gap:9px}
    .stat{background:#fff;border:3px solid #fff;border-radius:15px;padding:9px 16px;font-weight:900;font-size:clamp(14px,1.6vw,20px);box-shadow:0 5px 0 #5bb6d0,0 9px 20px #286e8840;white-space:nowrap}

    #question-label{display:block;color:#e47630;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.13em}
    #question-text{margin:4px 0 12px;font-weight:900;font-size:clamp(17px,2vw,23px);line-height:1.25}
    #choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;text-align:left}
    .choice{display:flex;align-items:center;gap:11px;min-height:54px;padding:8px 12px;background:white;border:2px solid var(--choice);border-radius:13px;font-size:clamp(14px,1.5vw,18px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
    .choice-letter{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--choice);color:#173750;font-size:19px;font-weight:900}
    #choice-a{--choice:#ffad4e}#choice-b{--choice:#71c9ed}#choice-c{--choice:#bba3f5}#choice-d{--choice:#8bd882}
    #play-area{position:relative;flex:1;min-height:300px;overflow:hidden;touch-action:none}
    #scene{position:absolute;inset:0}
    #scene canvas{display:block;width:100%;height:100%}
    #feedback{position:absolute;z-index:4;top:42%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;text-align:center;white-space:nowrap;font-size:clamp(38px,8vw,90px);font-weight:900;color:white;text-shadow:0 5px 0 #257e55,0 10px 24px #163d4eaa;transition:transform .2s,opacity .2s}
    #feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #feedback.wrong{text-shadow:0 5px 0 #b95c4a,0 10px 24px #163d4eaa}
    #sparkles{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
    .spark{position:absolute;left:50%;top:42%;font-size:30px;animation:burst .85s ease-out forwards}
    @keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(240deg) scale(.4);opacity:0}}
    #help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;background:#173750df;color:white;border:1px solid #ffffff55;border-radius:100px;padding:8px 16px;text-align:center;font-size:clamp(11px,1.4vw,15px);font-weight:800;white-space:nowrap;pointer-events:none}
    #finish{display:none;position:absolute;inset:0;z-index:10;background:#133a59b8;align-items:center;justify-content:center;padding:20px}
    #finish.visible{display:flex}
    .finish-card{width:min(520px,100%);padding:clamp(25px,5vw,48px);border-radius:32px;background:#fffdf0;border:5px solid white;box-shadow:0 12px 0 #e3b95e,0 27px 60px #0c354070;text-align:center}
    .finish-card h2{margin:0 0 14px;color:#e6533b;font-size:clamp(30px,6vw,53px);font-weight:900}
    .finish-card p{font-size:clamp(17px,2.5vw,22px);font-weight:800;line-height:1.35}
    #final-score{color:#166e83;font-size:clamp(25px,4vw,35px);font-weight:900}
    #restart{margin-top:14px;padding:15px 31px;border:0;border-radius:16px;background:#ed6046;color:white;box-shadow:0 6px 0 #b83f35;font-size:20px;font-weight:900;cursor:pointer}
    #restart:hover{background:#fa7052}

      #question-label{font-size:10px}
      #question-text{margin:3px 0 9px}
      #choices{grid-template-columns:1fr;gap:5px}
      .choice{min-height:39px;padding:4px 7px;gap:8px}
      .choice-letter{width:28px;height:28px;font-size:16px}
      #play-area{min-height:255px}
      #help{bottom:7px;padding:6px 10px}
    }

    {q:"Antara berikut, yang manakah merupakan contoh makanan daripada kumpulan buah-buahan dan sayur-sayuran?",a:["Epal dan lobak merah","Nasi dan mi","Ikan dan ayam","Minyak dan marjerin"],correct:0},
    {q:"Apakah fungsi utama makanan daripada kumpulan bijirin, bijirin penuh dan ubi-ubian?",a:["Membekalkan tenaga kepada badan","Membekalkan vitamin sahaja","Membekalkan lemak kepada badan","Menambahkan rasa manis kepada makanan"],correct:0},
    {q:"Antara berikut, yang manakah merupakan contoh makanan daripada kumpulan ikan, ayam, daging, telur dan kekacang?",a:["Nasi, roti dan kentang","Bayam, lobak dan epal","Ikan, telur dan kacang","Minyak masak, mentega dan gula"],correct:2},
    {q:"Mengapakah kita perlu mengambil makanan daripada pelbagai kumpulan dalam Piramid Makanan Malaysia?",a:["Supaya dapat mengambil satu jenis makanan sahaja","Supaya mendapat pelbagai nutrien yang diperlukan oleh badan","Supaya boleh mengambil makanan manis dengan lebih banyak","Supaya tidak perlu mengambil buah-buahan dan sayur-sayuran"],correct:1}
  ];
  const lanes=[-6,-2,2,6], letters=["A","B","C","D"];
  const colors=[0xffad4e,0x71c9ed,0xbba3f5,0x8bd882];
  const area=document.getElementById("play-area");
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x8bd8f7);
  scene.fog=new THREE.Fog(0x8bd8f7,55,150);
  const camera=new THREE.PerspectiveCamera(66,1,.1,220);
  camera.position.set(0,8,24);
  camera.lookAt(0,2,-18);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById("scene").appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x70a46b,2.1));
  const sun=new THREE.DirectionalLight(0xfff5cf,2.3);
  sun.position.set(-30,48,-35);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);
  const mat=(color,roughness=.7)=>new THREE.MeshStandardMaterial({color,roughness,side:THREE.DoubleSide});
  const green=mat(0x79c95e),darkGreen=mat(0x3f9c58),white=mat(0xffffff);
  const red=mat(0xe94437,.32),deepRed=mat(0xb92c2c),yellow=mat(0xffd35c),trunk=mat(0xa4714f);
  
  function mesh(geometry,material,parent,x=0,y=0,z=0){
    const object=new THREE.Mesh(geometry,material);
    object.position.set(x,y,z);
    parent.add(object);
    return object;
  }
  
  const ground=mesh(new THREE.PlaneGeometry(280,350),green,scene,0,-1,-65);
  ground.rotation.x=-Math.PI/2;
  const path=mesh(new THREE.PlaneGeometry(17,290),mat(0x9fd278),scene,0,-.97,-75);
  path.rotation.x=-Math.PI/2;
  
  for(let i=0;i<5;i++){
    const stripe=mesh(new THREE.PlaneGeometry(.11,290),mat(0xe9f6bc),scene,-8+i*4,-.95,-75);
    stripe.rotation.x=-Math.PI/2;
  }
  
  const lake=mesh(new THREE.CircleGeometry(19,48),mat(0x49b9dd,.25),scene,-34,-.92,-68);
  lake.rotation.x=-Math.PI/2;
  lake.scale.set(1.6,.75,1);
  
  for(let i=0;i<12;i++){
    const hill=mesh(new THREE.SphereGeometry(13+Math.random()*11,20,12),i%2?darkGreen:green,scene,(i-6)*24,-10,-100-Math.random()*35);
    hill.scale.y=.8;
  }
  
  const worldItems=[];
  for(let i=0;i<46;i++){
    const side=i%2?-1:1,z=-i*6-6,x=side*(12+Math.random()*25);
    const group=new THREE.Group();
    group.position.set(x,0,z);
    scene.add(group);
    worldItems.push(group);
    mesh(new THREE.CylinderGeometry(.15,.23,2,6),trunk,group,0,.15,0);
    mesh(new THREE.ConeGeometry(1.15+Math.random()*.5,3,7),i%3?darkGreen:green,group,0,2.2,0);
  }
  
  const mills=[];
  for(let i=0;i<5;i++){
    const g=new THREE.Group();
    g.position.set((i%2?-1:1)*(22+i*4),0,-25-i*32);
    scene.add(g);
    worldItems.push(g);
    mesh(new THREE.CylinderGeometry(.22,.55,8,10),white,g,0,3,0);
    const hub=new THREE.Group();
    hub.position.set(0,7,0);
    g.add(hub);
    mills.push(hub);
    mesh(new THREE.SphereGeometry(.45,10,8),yellow,hub);
    for(let b=0;b<3;b++){
      const blade=mesh(new THREE.BoxGeometry(.42,3.7,.12),white,hub,0,2,0);
      blade.rotation.z=b*Math.PI*2/3;
      blade.position.set(-Math.sin(blade.rotation.z)*2,Math.cos(blade.rotation.z)*2,0);
    }
  }
  
  for(let i=0;i<15;i++){
    const g=new THREE.Group();
    g.position.set((Math.random()-.5)*105,13+Math.random()*15,-15-Math.random()*115);
    scene.add(g);
    worldItems.push(g);
    for(let j=0;j<4;j++)mesh(new THREE.SphereGeometry(2+Math.random()*1.4,10,8),white,g,(j-1.5)*2,Math.sin(j)*.5,0);
    g.scale.setScalar(.7+Math.random()*.65);
  }
  
  const plane=new THREE.Group();
  plane.position.set(lanes[1],2.1,5);
  scene.add(plane);
  const body=mesh(new THREE.CapsuleGeometry(.57,2.4,8,14),red,plane);
  body.rotation.x=Math.PI/2;
  body.castShadow=true;
  const nose=mesh(new THREE.ConeGeometry(.56,1.15,18),red,plane,0,0,-2);
  nose.rotation.x=-Math.PI/2;
  mesh(new THREE.BoxGeometry(5.1,.16,1.05),red,plane,0,-.1,.2);
  mesh(new THREE.BoxGeometry(1.1,.12,.7),deepRed,plane,0,.05,1.35);
  mesh(new THREE.BoxGeometry(.15,.9,.76),deepRed,plane,0,.48,1.32);
  
  // Script continuation from original code
  const cockpit = mesh(new THREE.BoxGeometry(.7,.5,1.1), mat(0x222222), plane, 0, .45, -.15);
  const propGroup = new THREE.Group();
  propGroup.position.set(0, 0, -2.6);
  plane.add(propGroup);
  mesh(new THREE.CylinderGeometry(.12, .12, .3, 8), mat(0x333333), propGroup).rotation.x = Math.PI / 2;
  const prop = mesh(new THREE.BoxGeometry(2.4, .15, .05), white, propGroup, 0, 0, -.1);

  // Gates / Answer Targets
  const gates = new THREE.Group();
  scene.add(gates);
  const gateMeshes = [];
  for(let i=0; i<4; i++){
    const gate = new THREE.Group();
    gate.position.set(lanes[i], 0, 0);
    gates.add(gate);
    mesh(new THREE.BoxGeometry(3.6, .4, .4), mat(colors[i]), gate, 0, 3.4, 0);
    mesh(new THREE.BoxGeometry(.4, 3.6, .4), mat(colors[i]), gate, -1.6, 1.6, 0);
    mesh(new THREE.BoxGeometry(.4, 3.6, .4), mat(colors[i]), gate, 1.6, 1.6, 0);
    gateMeshes.push(gate);
  }

  // Game State
  let qIdx = 0, score = 0, currentLane = 1;
  let speed = 30, active = true, answered = false;
  const clock = new THREE.Clock();

  function loadQuestion() {
    if(qIdx >= questions.length) {
      endGame();
      return;
    }
    const q = questions[qIdx];
    document.getElementById("progress").innerText = `Soalan: ${qIdx + 1}/${questions.length}`;
    document.getElementById("question-text").innerText = q.q;
    const answerEls = document.querySelectorAll(".choice-answer");
    q.a.forEach((ans, i) => answerEls[i].innerText = ans);
    
    gates.position.z = -120;
    answered = false;
  }

  function createSparkles() {
    const container = document.getElementById("sparkles");
    for(let i=0; i<15; i++) {
      const sp = document.createElement("div");
      sp.className = "spark";
      sp.innerText = "✨";
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 80;
      sp.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      sp.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      container.appendChild(sp);
      setTimeout(() => sp.remove(), 850);
    }
  }

  function checkAnswer() {
    const correct = questions[qIdx].correct;
    const fb = document.getElementById("feedback");
    if(currentLane === correct) {
      score++;
      document.getElementById("score").innerText = `Skor: ${score}`;
      fb.innerText = "BETUL!";
      fb.className = "canva-banner show";
      createSparkles();
    } else {
      fb.innerText = "SALAH!";
      fb.className = "canva-banner show wrong";
    }
    
    setTimeout(() => {
      fb.className = "canva-banner";
      qIdx++;
      loadQuestion();
    }, 1500);
  }

  function endGame() {
    active = false;
    document.getElementById("finish").classList.add("visible");
    document.getElementById("final-score").innerText = `Skor Anda: ${score}/${questions.length}`;
    let msg = score === 5 ? "Hebat! Anda sangat arif tentang Piramid Makanan." : "Usaha yang baik! Sila cuba lagi.";
    document.getElementById("final-message").innerText = msg;
  }

  document.getElementById("restart").addEventListener("click", () => {
    qIdx = 0; 
    score = 0; 
    currentLane = 1;
    document.getElementById("score").innerText = "Skor: 0";
    document.getElementById("finish").classList.remove("visible");
    plane.position.x = lanes[currentLane];
    active = true;
    loadQuestion();
  });

  // Controls
  window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft" && currentLane > 0) currentLane--;
    if(e.key === "ArrowRight" && currentLane < 3) currentLane++;
  });
  
  let touchStartX = 0;
  area.addEventListener("touchstart", e => touchStartX = e.changedTouches[0].screenX);
  area.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if(dx < -30 && currentLane > 0) currentLane--;
    if(dx > 30 && currentLane < 3) currentLane++;
  });

  function resize() {
    camera.aspect = area.clientWidth / area.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(area.clientWidth, area.clientHeight);
  }
  window.addEventListener("resize", resize);
  resize();

  // Main Loop
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    
    prop.rotation.z += 20 * dt;
    mills.forEach(m => m.rotation.z += 1.5 * dt);

    if(!active) {
      renderer.render(scene, camera);
      return;
    }

    gates.position.z += speed * dt;
    
    worldItems.forEach(item => {
      item.position.z += speed * dt;
      if(item.position.z > 35) {
        item.position.z -= 160;
      }
    });

    const targetX = lanes[currentLane];
    plane.position.x += (targetX - plane.position.x) * 10 * dt;
    plane.rotation.z = (plane.position.x - targetX) * 0.12;
    plane.rotation.x = Math.sin(Date.now() * 0.003) * 0.05;
    plane.position.y = 2.1 + Math.sin(Date.now() * 0.004) * 0.15;

    if(!answered && gates.position.z > plane.position.z - 1.5 && gates.position.z < plane.position.z + 1.5) {
      answered = true;
      checkAnswer();
    }

    renderer.render(scene, camera);
  }

  loadQuestion();
  animate();

})();
  </script>
 </body>
</html>
